<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#035294">
<meta name="description" content="Mundial Technologies field log book for RFA MDC compliance monitoring poles — works offline, creates PDF reports.">
<title>Mundial Field Log Book</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --blue:#035294; --blue-d:#023d6e; --red:#ee1c25; --tint:#eef4fa; --line:#c5d6e8;
  --ink:#1a1a2e; --muted:#5b6475; --bg:#f4f7fb; --card:#fff; --ok:#1d7f3b; --warn:#b26a00;
  --r:12px; --shadow:0 1px 3px rgba(3,82,148,.12),0 4px 14px rgba(3,82,148,.06);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:4px solid var(--red);box-shadow:var(--shadow)}
.topbar img{height:40px}
.topbar .t{flex:1;min-width:0}
.topbar .t b{display:block;color:var(--blue);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t span{font-size:12px;color:var(--muted)}
.net{font-size:12px;padding:4px 10px;border-radius:99px;background:#e7f5ec;color:var(--ok);white-space:nowrap}
.net.off{background:#fdecec;color:#b3141b}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:22px;color:var(--blue);margin:8px 0 12px}
h2{font-size:18px;color:var(--blue);margin:0;padding:12px 16px;border-bottom:2px solid var(--red);background:#fff;border-radius:var(--r) var(--r) 0 0}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px}
.card .in{padding:14px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:10px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-weight:bold;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--blue);color:#fff}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--ink);font-weight:normal}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.tile{display:flex;flex-direction:column;gap:4px;padding:18px;border-radius:var(--r);background:#fff;box-shadow:var(--shadow);border:0;border-left:6px solid var(--blue);text-align:left;cursor:pointer}
.tile b{font-size:18px;color:var(--blue)} .tile span{color:var(--muted);font-size:14px}
.tile.red{border-left-color:var(--red)}
.rec{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--tint)}
.rec .info{flex:1;min-width:220px}
.rec .info b{color:var(--blue)} .rec .info div{font-size:13px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--tint);color:var(--blue);margin-right:4px}
.chip.draft{background:#fff4e0;color:var(--warn)} .chip.done{background:#e7f5ec;color:var(--ok)}
.chip.queued{background:#fff4e0;color:var(--warn)} .chip.sent{background:#e7f5ec;color:var(--ok)} .chip.failed{background:#fdecec;color:#b3141b}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:16px}
label.f textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(3,82,148,.25);border-color:var(--blue)}
.row{display:flex;gap:8px;align-items:flex-end}
.row>label.f{flex:1}
.poles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pole{padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:#fff;text-align:left;cursor:pointer}
.pole b{color:var(--blue)} .pole div{font-size:13px;color:var(--muted)}
.pole.sel{border-color:var(--blue);background:var(--tint);box-shadow:inset 0 0 0 1px var(--blue)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:46px;padding:8px 16px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer}
.seg button.on{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:bold}
.grp{padding:8px 16px;background:var(--tint);color:var(--blue);font-weight:bold;font-size:14px;letter-spacing:.3px}
.item{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--tint)}
.item .n{color:var(--muted);font-size:13px;text-align:center}
.item .tx{font-size:15px} .item .tx.star{font-weight:bold;color:var(--blue)}
.ofn{display:flex;gap:6px}
.ofn button{width:68px;min-height:46px;border-radius:10px;border:2px solid var(--line);background:#fff;font-weight:bold;cursor:pointer;font-size:14px}
.ofn button.ok.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ofn button.fault.on{background:var(--red);border-color:var(--red);color:#fff}
.ofn button.na.on{background:#7d8597;border-color:#7d8597;color:#fff}
.item .rmk{grid-column:2/4}
.item .rmk input{width:100%;min-height:42px;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px}
.jump{position:sticky;top:64px;z-index:15;display:flex;gap:6px;overflow-x:auto;padding:8px 16px;background:rgba(244,247,251,.96);border-bottom:1px solid var(--line);scrollbar-width:none}
.jump a{flex:none;padding:8px 14px;border-radius:99px;background:#fff;border:1.5px solid var(--line);color:var(--blue);text-decoration:none;font-size:14px;font-weight:bold}
.jump a.done{border-color:var(--ok);color:var(--ok)}
.bar{position:sticky;bottom:0;z-index:15;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:4px solid var(--blue);box-shadow:0 -4px 14px rgba(3,82,148,.1)}
.bar .prog{flex:1;min-width:200px;font-size:14px;color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--tint);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;background:var(--blue)}
.sig{border:2px dashed var(--line);border-radius:10px;background:#fff;touch-action:none;width:100%;height:170px;display:block}
.sigbox{display:flex;flex-direction:column;gap:8px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.sigbox .hd{display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:var(--blue)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.photo{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.photo img{width:100%;height:150px;object-fit:cover;display:block}
.photo input{width:100%;border:0;border-top:1px solid var(--line);padding:8px;min-height:40px}
.photo .x{display:flex;justify-content:flex-end;padding:4px}
.keyph{display:flex;flex-direction:column;gap:8px;padding:12px;border:2px dashed var(--red);border-radius:12px;background:#fff8f8}
.keyph.has{border-style:solid;border-color:var(--ok);background:#f4fbf6}
.keyph .kh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.keyph .kh b{color:var(--blue)}
.keyph img{max-width:320px;max-height:220px;border-radius:8px;object-fit:cover}
.keyph .kcap{flex:1;min-width:180px;min-height:38px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px}
.tripkm{grid-column:1/-1;padding:10px 14px;border-radius:10px;background:var(--tint);color:var(--muted);font-size:14px}
.tripkm.ok{background:#e7f5ec;color:#145a2a}.tripkm.ok b{font-size:17px;color:var(--blue)}.tripkm.bad{background:#fdecec;color:#b3141b}
.sigacts{display:flex;gap:6px}
.vlist{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-top:1px solid var(--tint);background:#fff}.vrow:first-child{border-top:0}
label.f select{min-height:46px}
.sigph{height:60px;border-radius:6px;border:1px solid var(--line)}
.annex .photo img{height:200px;object-fit:contain;background:#111}
.anxlab{padding:6px 10px;background:var(--blue);color:#fff;font-weight:bold;font-size:14px}
.photo .x{align-items:center}
.stamp-prev{max-width:200px;max-height:140px;border:1px dashed var(--line);border-radius:8px;padding:4px;background:#fff}
.hint{font-size:13px;color:var(--muted)}
.warn{padding:10px 14px;border-radius:10px;background:#fff4e0;color:#7a4a00;font-size:14px;margin:8px 0}
.okmsg{padding:10px 14px;border-radius:10px;background:#e7f5ec;color:#145a2a;font-size:14px;margin:8px 0}
table.t{width:100%;border-collapse:collapse}
table.t td,table.t th{padding:8px;border-bottom:1px solid var(--tint);text-align:left;font-size:14px}
table.t th{background:var(--blue);color:#fff}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:50;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);max-width:90vw;font-size:15px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:20px;box-shadow:var(--shadow)}
.modal .box h3{margin:0 0 8px;color:var(--blue)}
.modal .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;justify-content:flex-end}
.wm{position:fixed;inset:0;z-index:-1;background:url(assets/watermark.png) center 60%/min(80vw,700px) no-repeat;opacity:.9;pointer-events:none}
.incident{display:grid;grid-template-columns:150px 170px 1fr auto auto;gap:8px;align-items:center;padding:8px 16px;border-top:1px solid var(--tint)}
.incident input,.incident select{min-height:44px;padding:8px;border:1.5px solid var(--line);border-radius:8px;width:100%}
.res{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.res input{width:26px;height:26px;min-height:0}
@media (max-width:760px){.incident{grid-template-columns:1fr 1fr}.incident .note{grid-column:1/3}.item{grid-template-columns:28px 1fr}.item .ofn{grid-column:2}.item .rmk{grid-column:2}}
</style>
</head>
<body>
<div class="wm" aria-hidden="true"></div>
<header class="topbar">
  <img src="assets/logo.png" alt="Mundial Technologies">
  <div class="t"><b id="tb-title">Field Log Book</b><span>RFA MDC Compliance Monitoring · Log Book 1</span></div>
  <span id="net" class="net">Online</span>
</header>
<main id="app"></main>
<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/jspdf.plugin.autotable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
